<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PACE in the Classroom</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      .initial-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(ellipse at bottom, #1b2838 0%, #090a0f 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        position: relative;
      }
      
      /* Starfield background */
      .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(2px 2px at 20px 30px, #eee, transparent),
          radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
          radial-gradient(1px 1px at 90px 40px, #fff, transparent),
          radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
          radial-gradient(1px 1px at 230px 80px, #fff, transparent),
          radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
          radial-gradient(1px 1px at 350px 200px, #fff, transparent),
          radial-gradient(2px 2px at 420px 50px, rgba(255,255,255,0.8), transparent),
          radial-gradient(1px 1px at 500px 180px, #fff, transparent),
          radial-gradient(2px 2px at 580px 90px, rgba(255,255,255,0.9), transparent);
        background-size: 600px 250px;
        animation: twinkle 5s ease-in-out infinite;
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      
      /* Main container */
      .loader-container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      /* Earth */
      .earth-container {
        position: relative;
        width: 180px;
        height: 180px;
      }
      
      .earth {
        width: 120px;
        height: 120px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(135deg, 
          #1e4d6b 0%, 
          #2d7d9a 20%, 
          #3d9970 35%,
          #2d7d9a 50%, 
          #1e4d6b 70%,
          #0f3854 100%);
        box-shadow: 
          inset -25px -25px 40px rgba(0,0,0,0.5),
          inset 10px 10px 20px rgba(255,255,255,0.1),
          0 0 60px rgba(59, 130, 246, 0.3),
          0 0 100px rgba(59, 130, 246, 0.1);
        animation: earth-rotate 20s linear infinite;
        overflow: hidden;
      }
      
      .earth::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 100%;
        background: linear-gradient(90deg, 
          transparent 0%, 
          rgba(255,255,255,0.03) 25%,
          rgba(255,255,255,0.08) 50%, 
          rgba(255,255,255,0.03) 75%,
          transparent 100%);
        animation: earth-shine 20s linear infinite;
      }
      
      .earth::after {
        content: '';
        position: absolute;
        top: 15%;
        left: 20%;
        width: 15px;
        height: 8px;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        box-shadow: 
          40px 20px 0 rgba(255,255,255,0.1),
          -10px 50px 0 rgba(255,255,255,0.12),
          30px 60px 0 rgba(255,255,255,0.08);
      }
      
      @keyframes earth-rotate {
        from { background-position: 0 0; }
        to { background-position: 200px 0; }
      }
      
      @keyframes earth-shine {
        from { transform: translateX(-50%); }
        to { transform: translateX(0%); }
      }
      
      /* Orbit path */
      .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 170px;
        height: 170px;
        border: 1px dashed rgba(255,255,255,0.15);
        border-radius: 50%;
      }
      
      /* Satellite */
      .satellite-orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 170px;
        height: 170px;
        transform: translate(-50%, -50%);
        animation: orbit 3s linear infinite;
      }
      
      .satellite {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 28px;
        height: 28px;
      }
      
      .satellite-body {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 8px;
        background: linear-gradient(180deg, #e2e8f0, #94a3b8);
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
      }
      
      .satellite-panel {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 18px;
        background: linear-gradient(180deg, #3b82f6, #1e40af);
        border: 1px solid #60a5fa;
      }
      
      .satellite-panel.left {
        left: -2px;
        border-radius: 2px 0 0 2px;
      }
      
      .satellite-panel.right {
        right: -2px;
        border-radius: 0 2px 2px 0;
      }
      
      .satellite-signal {
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        background: #22d3ee;
        border-radius: 50%;
        animation: signal-pulse 1s ease-in-out infinite;
      }
      
      @keyframes orbit {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      @keyframes signal-pulse {
        0%, 100% { box-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee; opacity: 1; }
        50% { box-shadow: 0 0 15px #22d3ee, 0 0 25px #22d3ee; opacity: 0.7; }
      }
      
      /* Data streams */
      .data-stream {
        position: absolute;
        width: 2px;
        height: 30px;
        background: linear-gradient(180deg, transparent, #22d3ee, transparent);
        opacity: 0;
        animation: data-fall 2s linear infinite;
      }
      
      .data-stream:nth-child(1) { left: 20%; animation-delay: 0s; }
      .data-stream:nth-child(2) { left: 40%; animation-delay: 0.5s; }
      .data-stream:nth-child(3) { left: 60%; animation-delay: 1s; }
      .data-stream:nth-child(4) { left: 80%; animation-delay: 1.5s; }
      
      @keyframes data-fall {
        0% { top: -30px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      
      /* Text styles */
      .loader-title {
        margin-top: 40px;
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #22d3ee, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      
      .loader-subtitle {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 0.9rem;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      
      /* Progress bar */
      .progress-container {
        margin-top: 30px;
        width: 250px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #22d3ee, #34d399);
        border-radius: 2px;
        animation: progress 11s ease-out forwards;
      }
      
      @keyframes progress {
        0% { width: 0%; }
        20% { width: 20%; }
        40% { width: 45%; }
        60% { width: 70%; }
        80% { width: 85%; }
        100% { width: 100%; }
      }
      
      /* Timer */
      .timer {
        margin-top: 15px;
        font-size: 0.85rem;
        color: #64748b;
        font-family: 'Courier New', monospace;
      }
      
      .timer-value {
        color: #22d3ee;
        font-weight: 600;
      }
      
      /* Status messages */
      .status-message {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #64748b;
        animation: status-fade 3s ease-in-out infinite;
      }
      
      @keyframes status-fade {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      
      /* NASA badge */
      .nasa-badge {
        position: absolute;
        bottom: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        font-size: 0.75rem;
        letter-spacing: 1px;
      }
      
      .nasa-badge svg {
        width: 24px;
        height: 24px;
        fill: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loader - replaced when React mounts -->
      <div class="initial-loader">
        <div class="stars"></div>
        <div class="data-stream"></div>
        <div class="data-stream"></div>
        <div class="data-stream"></div>
        <div class="data-stream"></div>
        
        <div class="loader-container">
          <div class="earth-container">
            <div class="earth"></div>
            <div class="orbit"></div>
            <div class="satellite-orbit">
              <div class="satellite">
                <div class="satellite-panel left"></div>
                <div class="satellite-body"></div>
                <div class="satellite-panel right"></div>
                <div class="satellite-signal"></div>
              </div>
            </div>
          </div>
          
          <div class="loader-title">PACE</div>
          <div class="loader-subtitle">in the Classroom</div>
          
          <div class="progress-container">
            <div class="progress-bar"></div>
          </div>
          
          <div class="timer">Initializing<span class="timer-dots">...</span> <span class="timer-value" id="timer">0.0s</span></div>
          
          <div class="status-message">Connecting to NASA Earth Science Data</div>
        </div>
        
        <div class="nasa-badge">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1" fill="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/></svg>
          Powered by NASA PACE Mission
        </div>
      </div>
    </div>
    
    <script>
      // Timer functionality
      const timerEl = document.getElementById('timer');
      let startTime = Date.now();
      
      function updateTimer() {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        if (timerEl) {
          timerEl.textContent = elapsed + 's';
        }
        requestAnimationFrame(updateTimer);
      }
      updateTimer();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.botpress.cloud/webchat/v1/inject.js"></script>
    <script src="https://mediafiles.botpress.cloud/9287cbac-f7f9-4116-9fa7-f4a8c8db3a12/webchat/config.js" defer></script>
  </body>
</html>
